name: KithFood
options:
  bundleIdPrefix: com.kitaura
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ja
  createIntermediateGroups: true

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0

targets:
  KithFood:
    type: application
    scheme: {}
    platform: iOS
    sources:
      - path: KithFood
        excludes:
          - Resources/GoogleService-Info.plist
          - Resources/AWSConfig.plist
          - Resources/OwnerConfig.plist
      - path: KithFood/Resources/GoogleService-Info.plist
        buildPhase: resources
        optional: true
      - path: KithFood/Resources/AWSConfig.plist
        buildPhase: resources
        optional: true
      - path: KithFood/Resources/OwnerConfig.plist
        buildPhase: resources
        optional: true
    info:
      path: KithFood/Info.plist
      properties:
        CFBundleDisplayName: Kith Food
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSPhotoLibraryUsageDescription: 料理の写真と撮影場所・日時を読み込むために使います
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - com.googleusercontent.apps.349958284384-dkki8ribiar56jkgs03meb9497g5fmql
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - kithfood
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseFunctions
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kitaura.kithfood
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: LMH979L5HP
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
